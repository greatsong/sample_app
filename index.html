<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>생활 데이터 웹앱</title>
    <link rel="stylesheet" href="./css/style.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Weather · Village Bus · School Meal</p>
        <h1>생활 데이터를 연결하는 웹앱</h1>
        <p class="lead">날씨, 마을버스, NEIS 급식 API를 연결하고 급식 메뉴에 투표합니다.</p>
        <p class="lead"><a href="./textbook.html" style="color:white;font-weight:800">교재 보기</a> · <a href="./docs/BUS_API_KEY_GUIDE.md" style="color:white;font-weight:800">버스 키 발급 가이드</a></p>
      </div>
      <button id="refreshButton" type="button">새로고침</button>
    </header>
    <main class="layout">
      <section class="panel api-panel">
        <h2>오늘의 API 데이터</h2>
        <div id="status" class="status">초기 데이터를 불러오는 중...</div>
        <div id="apiGrid" class="api-grid"></div>
      </section>
      <section class="panel vote-panel">
        <h2>급식 맛있는 메뉴 투표</h2>
        <div id="mealVote" class="vote-list"></div>
      </section>
      <section class="panel side-panel">
        <h2>연동 상태</h2>
        <dl class="connection-list">
          <div><dt>날씨</dt><dd id="weatherState">연결 확인 중</dd></div>
          <div><dt>마을버스</dt><dd id="busState">설정 확인 중</dd></div>
          <div><dt>NEIS 급식</dt><dd id="mealState">연결 확인 중</dd></div>
          <div><dt>투표 저장</dt><dd id="voteState">브라우저 저장소 사용 중</dd></div>
        </dl>
      </section>
    </main>
    <script src="./js/config.js"></script>
    <script src="./js/adapters/api-services.js"></script>
    <script src="./js/adapters/vote-store.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
