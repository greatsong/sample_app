<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>생활 데이터 웹앱 만들기 교재</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
      .textbook{width:min(960px,calc(100% - 32px));margin:32px auto 64px}
      .textbook article{display:grid;gap:18px}
      .textbook h2{margin:26px 0 4px;font-size:1.55rem}
      .textbook h3{margin:18px 0 2px;font-size:1.18rem}
      .textbook p{margin:0;line-height:1.78}
      .textbook ul,.textbook ol{margin:0;padding-left:22px;line-height:1.75}
      .textbook li{margin:4px 0}
      .textbook pre{overflow:auto;border:1px solid var(--line);border-radius:8px;padding:14px;background:#fbfcfb;line-height:1.55}
      .textbook code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .textbook a{color:var(--accent-dark);font-weight:700}
      .top-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
      .top-links a{border-radius:6px;padding:10px 12px;background:white;color:var(--accent-dark);text-decoration:none;font-weight:800}
    </style>
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">Complete Textbook</p>
        <h1>생활 데이터 웹앱 만들기</h1>
        <p class="lead">GitHub Pages, 바이브 코딩, Google Sheets, 날씨, 마을버스, NEIS 급식, 투표, DB 연동까지 이어지는 왕초보용 상세 교재입니다.</p>
        <div class="top-links"><a href="./">샘플 앱</a><a href="./docs/TEXTBOOK.md">Markdown 교재</a><a href="./docs/BUS_API_KEY_GUIDE.md">버스 키 발급 가이드</a></div>
      </div>
    </header>
    <main class="textbook">
      <article id="textbookContent" class="panel">
        <p>교재를 불러오는 중입니다.</p>
      </article>
    </main>
    <script>
      const content = document.querySelector("#textbookContent");

      fetch("./docs/TEXTBOOK.md")
        .then((response) => {
          if (!response.ok) {
            throw new Error("교재 파일을 불러오지 못했습니다.");
          }
          return response.text();
        })
        .then((markdown) => {
          content.innerHTML = renderMarkdown(markdown);
        })
        .catch((error) => {
          content.innerHTML = `<p>${escapeHtml(error.message)}</p><p><a href="./docs/TEXTBOOK.md">Markdown 교재를 직접 열기</a></p>`;
        });

      function renderMarkdown(markdown) {
        const lines = markdown.split("\n");
        const html = [];
        let listType = null;
        let inCode = false;
        let codeLines = [];

        for (const line of lines) {
          if (line.startsWith("```")) {
            if (inCode) {
              html.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
              codeLines = [];
              inCode = false;
            } else {
              closeList();
              inCode = true;
            }
            continue;
          }

          if (inCode) {
            codeLines.push(line);
            continue;
          }

          if (!line.trim()) {
            closeList();
            continue;
          }

          if (line.startsWith("# ")) {
            closeList();
            html.push(`<h2>${inline(line.slice(2))}</h2>`);
            continue;
          }

          if (line.startsWith("## ")) {
            closeList();
            html.push(`<h2>${inline(line.slice(3))}</h2>`);
            continue;
          }

          if (line.startsWith("### ")) {
            closeList();
            html.push(`<h3>${inline(line.slice(4))}</h3>`);
            continue;
          }

          if (line.startsWith("- ")) {
            openList("ul");
            html.push(`<li>${inline(line.slice(2))}</li>`);
            continue;
          }

          if (/^\d+\. /.test(line)) {
            openList("ol");
            html.push(`<li>${inline(line.replace(/^\d+\. /, ""))}</li>`);
            continue;
          }

          closeList();
          html.push(`<p>${inline(line)}</p>`);
        }

        closeList();
        return html.join("");

        function openList(type) {
          if (listType === type) return;
          closeList();
          html.push(`<${type}>`);
          listType = type;
        }

        function closeList() {
          if (!listType) return;
          html.push(`</${listType}>`);
          listType = null;
        }
      }

      function inline(value) {
        return escapeHtml(value)
          .replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
    </script>
  </body>
</html>
