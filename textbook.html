<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>생활 데이터 웹앱 만들기 웹 교재</title>
    <link rel="stylesheet" href="./css/style.css">
    <style>
      :root{--book-bg:#f7f4ef;--paper:#fffef9;--ink:#202322;--soft:#eef7f4;--note:#fff7df;--warn:#fff0f0}
      body{background:var(--book-bg);color:var(--ink)}
      .book-hero{min-height:340px}
      .book-wrap{width:min(1180px,calc(100% - 32px));margin:24px auto 72px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px}
      .book-nav{position:sticky;top:16px;align-self:start;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:14px;max-height:calc(100vh - 32px);overflow:auto}
      .book-nav strong{display:block;margin-bottom:10px}
      .book-nav a{display:block;border-radius:6px;padding:8px 10px;color:var(--text);text-decoration:none;font-weight:750;font-size:.94rem}
      .book-nav a:hover{background:#e7f5f2;color:var(--accent-dark)}
      .book-main{display:grid;gap:18px}
      .book-panel{border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:28px}
      .book-panel h1{font-size:2.15rem;margin:0 0 14px}
      .book-panel h2{font-size:1.55rem;margin:34px 0 12px;border-top:1px solid var(--line);padding-top:24px}
      .book-panel h3{font-size:1.18rem;margin:24px 0 10px}
      .book-panel p{line-height:1.78;margin:0 0 13px}
      .book-panel ul,.book-panel ol{line-height:1.72;margin:0 0 14px;padding-left:24px}
      .book-panel li{margin:5px 0}
      .book-panel pre{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fbfcfb;padding:14px;line-height:1.55}
      .book-panel code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .book-panel blockquote{margin:14px 0;padding:14px 16px;border-left:4px solid var(--accent);background:var(--soft);border-radius:6px}
      .top-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
      .top-links a{border-radius:6px;padding:10px 12px;background:white;color:var(--accent-dark);text-decoration:none;font-weight:800}
      .loading{color:var(--muted)}
      .book-meta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
      .pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 10px;background:#e7f5f2;color:var(--accent-dark);font-size:.86rem;font-weight:800}
      .section-card{border:1px solid var(--line);border-radius:8px;background:#fff;padding:14px;margin:16px 0}
      @media(max-width:860px){.book-wrap{grid-template-columns:1fr}.book-nav{position:static;max-height:none}.book-nav a{display:inline-block}.book-panel{padding:18px}.book-hero{min-height:420px}}
    </style>
  </head>
  <body>
    <header class="app-header book-hero">
      <div>
        <p class="eyebrow">Web Textbook · Full Practice Edition</p>
        <h1>생활 데이터 웹앱 만들기</h1>
        <p class="lead">완성본 체험에서 시작해 파일 구조, 날씨 API, 급식 API, Google Sheets 투표 저장, 버스 프록시, 나만의 학교/정류소 설정까지 이어지는 왕초보용 웹 교재입니다.</p>
        <div class="top-links">
          <a href="./">샘플 앱 열기</a>
          <a href="./docs/TEXTBOOK.md">Markdown 원문</a>
          <a href="./docs/BUS_PROXY_GUIDE.md">버스 프록시 가이드</a>
        </div>
      </div>
    </header>

    <div class="book-wrap">
      <nav class="book-nav" aria-label="교재 목차">
        <strong>수업 목차</strong>
        <div id="toc"><span class="loading">목차를 불러오는 중입니다.</span></div>
      </nav>

      <main class="book-main">
        <article id="content" class="book-panel">
          <p class="loading">교재 본문을 불러오는 중입니다.</p>
        </article>
      </main>
    </div>

    <script>
      const content = document.querySelector("#content");
      const toc = document.querySelector("#toc");

      fetch("./docs/TEXTBOOK.md", { cache: "no-cache" })
        .then((response) => {
          if (!response.ok) throw new Error("교재 파일을 불러오지 못했습니다.");
          return response.text();
        })
        .then((markdown) => {
          const { html, headings } = renderMarkdown(markdown);
          content.innerHTML = html;
          toc.innerHTML = headings.map((item) => `<a href="#${item.id}">${escapeHtml(item.text)}</a>`).join("");
        })
        .catch((error) => {
          content.innerHTML = `<p>${escapeHtml(error.message)}</p><p><a href="./docs/TEXTBOOK.md">Markdown 교재를 직접 열기</a></p>`;
          toc.innerHTML = '<a href="./docs/TEXTBOOK.md">Markdown 원문</a>';
        });

      function renderMarkdown(markdown) {
        const lines = markdown.split("\n");
        const html = [];
        const headings = [];
        let listType = null;
        let inCode = false;
        let codeLines = [];
        let paragraph = [];

        for (const line of lines) {
          if (line.startsWith("```")) {
            flushParagraph();
            if (inCode) {
              html.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
              codeLines = [];
              inCode = false;
            } else {
              closeList();
              inCode = true;
            }
            continue;
          }

          if (inCode) {
            codeLines.push(line);
            continue;
          }

          if (!line.trim()) {
            flushParagraph();
            closeList();
            continue;
          }

          const heading = /^(#{1,3})\s+(.+)$/.exec(line);
          if (heading) {
            flushParagraph();
            closeList();
            const level = heading[1].length;
            const text = heading[2].trim();
            const id = slug(text, headings.length);
            headings.push({ id, text });
            html.push(`<h${level} id="${id}">${inline(text)}</h${level}>`);
            continue;
          }

          if (line.startsWith("- ")) {
            flushParagraph();
            openList("ul");
            html.push(`<li>${inline(line.slice(2))}</li>`);
            continue;
          }

          if (/^\d+\. /.test(line)) {
            flushParagraph();
            openList("ol");
            html.push(`<li>${inline(line.replace(/^\d+\. /, ""))}</li>`);
            continue;
          }

          if (line.startsWith("> ")) {
            flushParagraph();
            closeList();
            html.push(`<blockquote>${inline(line.slice(2))}</blockquote>`);
            continue;
          }

          paragraph.push(line);
        }

        flushParagraph();
        closeList();
        return { html: html.join(""), headings };

        function openList(type) {
          if (listType === type) return;
          closeList();
          html.push(`<${type}>`);
          listType = type;
        }

        function closeList() {
          if (!listType) return;
          html.push(`</${listType}>`);
          listType = null;
        }

        function flushParagraph() {
          if (!paragraph.length) return;
          html.push(`<p>${inline(paragraph.join(" "))}</p>`);
          paragraph = [];
        }
      }

      function inline(value) {
        return escapeHtml(value)
          .replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
      }

      function slug(text, index) {
        return `section-${index}-${text.toLowerCase().replace(/[^a-z0-9가-힣]+/g, "-").replace(/^-|-$/g, "")}`;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
    </script>
  </body>
</html>
